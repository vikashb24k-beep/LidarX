# Twist multiplexer configuration for ROS 2 velocity stream arbitration
# Priorities: Keyboard Teleop (100) > Autonomous Waypoint Navigator (10)
# Lock: emergency stop topic (/e_stop) priority 255

twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 100
      navigation:
        topic: /cmd_vel_nav
        timeout: 0.5
        priority: 10
    locks:
      e_stop:
        topic: /e_stop
        timeout: 0.0
        priority: 255

